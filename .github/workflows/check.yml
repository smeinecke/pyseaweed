name: Code Checks

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  validate:
    name: Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Primes
        id: cache-primes
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: uv-cache-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            uv-cache-

      - name: Set up Python environment
        run: |
          wget -qO- https://astral.sh/uv/install.sh | sh
          uv sync

      - name: Run Ruff (PEP 8 Formatting)
        run: |
          uv run make format

      - name: Run Ruff (Linting + Docstrings)
        run: |
          uv run make check

      - name: Run vulture (Duplicate Code)
        run: |
          uv run make vulture

      - name: Run xenon (Cyclomatic Complexity)
        run: |
          uv run make xenon

      - name: Run bandit (Security)
        run: |
          uv run make bandit

      - name: Run pyright (Type Checking)
        run: |
          uv run make pyright

      - name: Build documentation
        run: |
          uv run --group docs sphinx-build -W -b html docs docs/_build

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python environment
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run pytest (Unit Tests)
        run: |
          uv run pytest tests/unit -v --cov=pyseaweed --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./coverage.xml

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [validate, test]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start SeaweedFS
        run: |
          docker run -d --name pyseaweed-test-fs --network host chrislusf/seaweedfs server -dir=/data -ip=localhost -volume.max=5 -filer
          echo "Waiting for SeaweedFS master to be ready..."
          timeout 60 bash -c 'until nc -z localhost 9333; do sleep 1; done'
          echo "SeaweedFS master is ready!"
          echo "Waiting for SeaweedFS volume to be ready..."
          timeout 60 bash -c 'until nc -z localhost 8080; do sleep 1; done'
          echo "SeaweedFS volume is ready!"
          echo "Waiting for a writable volume..."
          timeout 60 bash -c 'until curl -sf "http://localhost:9333/dir/assign" | grep -q "\"fid\""; do sleep 1; done'
          echo "SeaweedFS is writable!"
          echo "Waiting for SeaweedFS filer to be ready..."
          timeout 60 bash -c 'until nc -z localhost 8888; do sleep 1; done'
          echo "SeaweedFS filer is ready!"
          docker run -d --name pyseaweed-toxiproxy --network host ghcr.io/shopify/toxiproxy:2.12.0
          echo "Waiting for toxiproxy to be ready..."
          timeout 60 bash -c 'until nc -z localhost 8474; do sleep 1; done'
          echo "toxiproxy is ready!"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: uv-cache-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            uv-cache-

      - name: Set up Python environment
        run: |
          wget -qO- https://astral.sh/uv/install.sh | sh
          uv sync

      - name: Run Integration Tests
        run: |
          uv run pytest tests/integration -v -m integration --timeout=120

      - name: Stop services
        if: always()
        run: docker rm -f pyseaweed-test-fs pyseaweed-toxiproxy
