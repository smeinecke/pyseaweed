[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyseaweed"
dynamic = ["version"]
description = "Module to simplify usage of SeaweedFS in python."
readme = "README.rst"
license = "MIT"
authors = [
    {name = "Łukasz Bołdys", email = "mail@utek.pl"},
]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.33",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/utek/pyseaweed"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "httmock>=1.4.0",
    "ruff>=0.16.8",
    "radon>=6.0.1",
    "xenon>=0.9.3",
    "vulture>=2.16",
    "pyright>=1.1.414",
    "bandit>=1.9.4",
    "pre-commit>=4.6.2",
]
docs = [
    "sphinx>=8.1",
    "sphinx-rtd-theme>=3.0",
]

[tool.hatch.version]
path = "src/pyseaweed/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyseaweed"]

[tool.ruff]
target-version = "py313"
exclude = ["docs", "tests"]
line-length = 160
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
preview = true

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
extend-select = [
    "ANN",
    "UP",
    "I",
]
select = ["E9", "F82", "D"]
ignore = ["D203", "D213", "D100", "F821"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
testpaths = [
    "tests/unit",
    "tests/integration",
]
markers = [
    "integration: marks tests as integration tests that connect to a live SeaweedFS server",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false
reportPrivateUsage = false
exclude = ["**/__pycache__", "**/node_modules", "**/dist", "**/build", "**/venv", "**/.venv", "docs"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "docs"]
skips = ["B311"]

[tool.vulture]
exclude = ["dist", "build", "venv", ".venv", "tests", "docs"]
ignore_names = ["WeedFS", "VERSION", "exc_type", "exc_val", "exc_tb"]
min_confidence = 80
paths = ["."]
sort_by_size = true
